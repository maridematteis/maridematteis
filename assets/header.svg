<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect width="1200" height="360" rx="18" fill="#0D1117"/>

  <!-- Stratigraphic / layered background -->
  <path
    d="M0 285
       C170 255 310 310 480 280
       C670 245 820 290 1200 250
       V360 H0 Z"
    fill="#142A38"
    opacity="0.65"
  />

  <path
    d="M0 315
       C220 280 380 335 590 303
       C790 273 950 325 1200 292
       V360 H0 Z"
    fill="#1A3542"
    opacity="0.55"
  />

  <!-- Knowledge graph -->
  <g
    stroke="#8FAE9D"
    stroke-width="1.4"
    opacity="0.6"
  >
    <line x1="90" y1="105" x2="160" y2="72"/>
    <line x1="160" y1="72" x2="222" y2="120"/>
    <line x1="90" y1="105" x2="126" y2="172"/>
    <line x1="126" y1="172" x2="205" y2="196"/>
    <line x1="205" y1="196" x2="222" y2="120"/>
    <line x1="126" y1="172" x2="72" y2="220"/>
  </g>

  <g fill="#0D1117" stroke="#8FAE9D" stroke-width="2">
    <circle cx="90" cy="105" r="8"/>
    <circle cx="160" cy="72" r="6"/>
    <circle cx="222" cy="120" r="8"/>
    <circle cx="126" cy="172" r="7"/>
    <circle cx="205" cy="196" r="6"/>
    <circle cx="72" cy="220" r="5"/>
  </g>

  <!-- Small archaeological motif -->
  <g
    transform="translate(145 118)"
    stroke="#D8C3A5"
    stroke-width="2"
    fill="none"
    opacity="0.9"
  >
    <path d="M0 0 C-14 18 -13 42 0 55"/>
    <path d="M0 0 C14 18 13 42 0 55"/>
    <path d="M-12 24 H12"/>
    <path d="M-9 43 H9"/>
  </g>

  <!-- Main title -->
  <text
    x="335"
    y="126"
    fill="#E6EDF3"
    font-family="Arial, Helvetica, sans-serif"
    font-size="43"
    font-weight="700"
    letter-spacing="3"
  >
    MARIA DE MATTEIS
  </text>

  <text
    x="338"
    y="165"
    fill="#8FAE9D"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    letter-spacing="4"
  >
    ARCHAEOLOGY · DATA · DIGITAL HUMANITIES
  </text>

  <!-- Tagline -->
  <text
    x="338"
    y="222"
    fill="#C9D1D9"
    font-family="Georgia, serif"
    font-style="italic"
    font-size="18"
  >
    excavating the past · modelling knowledge · building digital experiences
  </text>

  <!-- Code-like detail -->
  <text
    x="338"
    y="275"
    fill="#7AA2A9"
    font-family="monospace"
    font-size="13"
    opacity="0.8"
  >
    &lt;heritage&gt; → data → knowledge → experience
  </text>

  <!-- Stylised elf -->
  <g transform="translate(1010 75)">

    <!-- Hair -->
    <path
      d="M16 70
         C15 12 100 -2 137 35
         C161 60 153 127 119 146
         L37 144
         C9 123 -1 100 16 70 Z"
      fill="#142A38"
      stroke="#8FAE9D"
      stroke-width="2"
    />

    <!-- Face -->
    <path
      d="M40 51
         C53 29 104 28 120 52
         V100
         C112 129 55 131 38 99 Z"
      fill="#D8C3A5"
      opacity="0.92"
    />

    <!-- Ears -->
    <path
      d="M40 65 L4 48 L36 84 Z"
      fill="#D8C3A5"
      stroke="#8FAE9D"
      stroke-width="1.5"
    />

    <path
      d="M121 65 L157 48 L124 84 Z"
      fill="#D8C3A5"
      stroke="#8FAE9D"
      stroke-width="1.5"
    />

    <!-- Hair fringe -->
    <path
      d="M31 54
         C39 20 114 14 130 50
         C101 39 74 53 31 54 Z"
      fill="#142A38"
    />

    <!-- Eyes -->
    <circle cx="61" cy="77" r="3.5" fill="#0D1117"/>
    <circle cx="101" cy="77" r="3.5" fill="#0D1117"/>

    <!-- Smile -->
    <path
      d="M72 99 Q82 106 92 99"
      stroke="#0D1117"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
    />

    <!-- Graph connection -->
    <circle
      cx="147"
      cy="130"
      r="5"
      fill="#0D1117"
      stroke="#8FAE9D"
      stroke-width="2"
    />

    <line
      x1="125"
      y1="112"
      x2="144"
      y2="127"
      stroke="#8FAE9D"
      opacity="0.7"
    />
  </g>

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="358"
    rx="17"
    stroke="#30363D"
    stroke-width="2"
  />
</svg>
